name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q notebook-ai-project.zip
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and prepare
        working-directory: notebook-ai
        run: |
          npm install
          npm test
          npm run prepare:www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: notebook-ai/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-ai-apk
          path: notebook-ai/android/app/build/outputs/apk/debug/app-debug.apk
